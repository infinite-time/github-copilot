name: Build and Deploy Marp Slides

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # HTML deck — this is what gets served on GitHub Pages.
      # HTML export needs no browser, so this step is rock-solid.
      - name: Build HTML slides
        run: |
          mkdir -p _site
          npx --yes @marp-team/marp-cli@latest index.md \
            --no-stdin --html --output _site/index.html

      # PDF + PPTX exports need a headless browser. GitHub's ubuntu-latest
      # runner ships Google Chrome, so these normally just work. They are
      # marked best-effort so a browser hiccup never blocks the deploy.
      - name: Build PDF and PPTX (best-effort)
        continue-on-error: true
        run: |
          npx --yes @marp-team/marp-cli@latest index.md \
            --no-stdin --pdf  --allow-local-files --output _site/slides.pdf
          npx --yes @marp-team/marp-cli@latest index.md \
            --no-stdin --pptx --allow-local-files --output _site/slides.pptx

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
